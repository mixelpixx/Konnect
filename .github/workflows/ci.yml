name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      - name: Test (unit + integration)
        run: cargo test --workspace --locked --lib --tests
      # --doc cannot be combined with --lib/--tests; doctests broke silently
      # once (PR #49) because they were never run in CI.
      - name: Doctests
        run: cargo test --workspace --locked --doc

  # The KiCAD action plugin is Python, so cargo never sees it. Its only real
  # logic is the server-PID bookkeeping (#103), where an unconditional
  # os.remove let one KiCAD session delete another's record and leak an
  # unreapable server. The tests stub pcbnew/wx, so no KiCAD is needed.
  plugin:
    name: Plugin (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test
        run: python -m unittest discover -s plugin/tests -v

  # flake.nix pins its own toolchain, dependency set and build flags, so
  # nothing else in CI would notice it going stale — and it names things
  # that move: `-p konnect --bin konnect`, rust-toolchain.toml, and a
  # preCheck that supplies KONNECT_STATE_DIR for the tests that need a
  # writable state dir. Without this job it is broken-on-arrival the first
  # time any of those changes, and only Nix users find out.
  nix:
    name: Nix flake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - name: Check flake metadata
        run: nix flake check --no-build
      - name: Build the package
        run: nix build .#konnect --print-build-logs

  # schematic-viewer is intentionally outside the workspace (Tauri app), so
  # --workspace never touches it. Without this job a viewer break ships
  # silently: release builds it with continue-on-error and the PCM scripts
  # omit a missing viewer binary without failing.
  viewer:
    name: Schematic viewer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: viewer
          workspaces: crates/schematic-viewer
      - name: Check
        run: cargo check --locked --manifest-path crates/schematic-viewer/Cargo.toml
      - name: Test
        run: cargo test --locked --manifest-path crates/schematic-viewer/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      # --all-targets so tests, benches and examples are linted too. Without it
      # test code is never checked, and it had accumulated real findings: eight
      # `MutexGuard` held across an await, a dropped coordinate that left half
      # of a transform assertion unwritten, and a handful of style lints (#121).
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  packaging:
    name: PCM packaging validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate repository metadata
        run: python packaging/validate-pcm.py --metadata packaging/metadata.json

      # Stub binaries carry each platform's executable magic: the validator
      # checks a package's bundled binary against the platform it declares,
      # which is what stops a Windows-only zip from being offered to every OS.
      - name: Assemble Windows PCM zip with a stub binary and validate structure
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllBytes("stub-konnect.exe", [byte[]](0x4D, 0x5A, 0x90, 0x00))
          ./packaging/build-pcm.ps1 -Version 0.0.0 -BinaryPath stub-konnect.exe `
            -Platform windows -OutDir dist
          python packaging/validate-pcm.py --zip dist/konnect-pcm-v0.0.0-windows.zip

      # build-pcm.sh is what the macOS and Linux release packages are built
      # with, so it gets the same structural check.
      - name: Assemble Linux PCM zip with a stub binary and validate structure
        run: |
          set -euo pipefail
          printf '\177ELF\002\001\001\000' > stub-konnect
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-konnect \
            --platform linux --out dist
          python packaging/validate-pcm.py --zip dist/konnect-pcm-v0.0.0-linux.zip

      - name: Reject a package whose binary contradicts its platform
        run: |
          set -euo pipefail
          # The exact mistake v0.1.3 shipped: a Windows binary in a package
          # non-Windows users are offered. The gate must fail here.
          printf 'MZ\220\000' > stub-konnect-win
          ./packaging/build-pcm.sh --version 0.0.0 --binary stub-konnect-win \
            --platform linux --out dist-bad
          if python packaging/validate-pcm.py --zip dist-bad/konnect-pcm-v0.0.0-linux.zip; then
            echo "::error::validator accepted a Windows binary in a linux package"
            exit 1
          fi
          echo "OK: mismatched binary/platform correctly rejected"
