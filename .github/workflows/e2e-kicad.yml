name: E2E (real KiCAD)

# Full-stack verification against a real KiCAD installation:
#   - the e2e test drives the shipped binary over stdio through
#     create → place → wire → ERC → Gerber export → DRC using real kicad-cli
#   - the conformance suite round-trips every schematic in KiCAD's demo corpus
#   - the PCM package is assembled and schema-validated
#
# Runs weekly, on demand, as the reusable release gate, and for a PR only when
# a maintainer applies `run:e2e-kicad`. Installing KiCAD costs several minutes,
# so this remains an opt-in PR lane rather than an ordinary required check.
# `release.yml` calls this workflow at the tag commit and cannot publish until
# the call succeeds.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  workflow_call:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Full design loop on windows-latest
    if: github.event_name != 'pull_request' || github.event.label.name == 'run:e2e-kicad'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: protoc@3.23.4
          fallback: none

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e-kicad

      # Pinned: an unpinned install would silently switch what E2E tests the
      # day KiCAD 11 ships, while metadata.json still declares kicad_version
      # 10.x. Bump deliberately alongside the supported-version claim.
      - name: Install KiCAD
        run: choco install kicad --version=10.0.5 --no-progress --yes

      - name: Locate kicad-cli and demos
        id: kicad
        shell: pwsh
        run: |
          $cli = Get-ChildItem "C:\Program Files\KiCad" -Recurse -Filter kicad-cli.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $cli) { $cli = Get-ChildItem "C:\KiCad" -Recurse -Filter kicad-cli.exe -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName }
          if (-not $cli) { throw "kicad-cli.exe not found after install" }
          "KICAD_CLI=$cli" | Out-File $env:GITHUB_ENV -Append
          $demos = Join-Path (Split-Path (Split-Path $cli)) "share\kicad\demos"
          if (Test-Path $demos) { "KICAD_DEMOS=$demos" | Out-File $env:GITHUB_ENV -Append }
          & $cli --version

      - name: E2E design loop (create → wire → ERC → Gerber → DRC)
        env:
          KONNECT_E2E_KEEP_DIR: ${{ github.workspace }}/e2e-artifacts
        run: cargo test -p konnect --test e2e_kicad -- --ignored --nocapture

      # Bundled templates are hand-written JSON naming KiCad symbols and pins;
      # this is the only job with a symbol library to check them against (#783).
      - name: Bundled templates name real KiCad symbols and pins
        run: cargo test -p konnect-core --lib builtin_templates_name_symbols_and_pins_that_exist_in_kicad -- --nocapture

      - name: Demo-corpus conformance (115+ eeschema-authored schematics)
        run: cargo test -p konnect-core --test conformance_test -- --nocapture

      # The variant grammar of record (fixtures/variants/README.md) is
      # evidence adjudicated by kicad-cli; this re-runs the adjudication so a
      # KiCad update that changes variant handling is noticed here, not by a
      # user. kicad-cli-only — no GUI session required.
      - name: Variant-grammar adjudication (kicad-cli acceptance)
        run: cargo test -p konnect-sexp --test variant_fixture_test -- --ignored --nocapture

      - name: IPC wedge timeout regression
        run: cargo test -p konnect-ipc --test mock_server_test -- --ignored --nocapture

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Assemble + schema-validate PCM package
        shell: pwsh
        run: |
          python -m pip install jsonschema
          cargo build --release --locked -p konnect
          ./packaging/build-pcm.ps1 -Version 0.0.0 -BinaryPath target/release/konnect.exe -Platform windows -OutDir dist
          python packaging/validate-pcm.py --zip dist/konnect-pcm-v0.0.0-windows.zip

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artifacts
          path: |
            dist/
            e2e-artifacts/
          if-no-files-found: ignore
