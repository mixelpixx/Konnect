name: Release

on:
  push:
    tags:
      - 'v*'

# Job-level permissions only: the build jobs never need write access, so the
# `release` job below is the sole holder of contents: write.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: konnect
  # Embedded into get_installation_info so release artifacts identify the
  # exact source commit even when built outside a Git working tree.
  KONNECT_BUILD_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml overrides the action-installed stable with the
      # pinned toolchain, which only has the host target — cross targets
      # (x86_64-apple-darwin on arm64 runners) must be added to the ACTIVE
      # toolchain explicitly or the build dies with E0463 (v0.2.1 lesson).
      - name: Add matrix target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p konnect

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ${{ env.BINARY_NAME }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path "${{ env.BINARY_NAME }}.exe" -DestinationPath "../../../${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.*

  pcm-package:
    name: KiCAD PCM plugin package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # macOS packages ship a universal binary so one download serves both
      # Apple Silicon and Intel — PCM has no architecture dimension, only
      # platform, so an arm64-only "macos" package would break Intel Macs.
      - name: Add x86_64 target (macOS universal)
        if: matrix.platform == 'macos'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: pcm-package-${{ matrix.platform }}

      # Tauri 2 needs the GTK/WebKit stack to compile on Linux. Without
      # these the viewer build fails on glib-sys and (before the require
      # gate below existed) the Linux zip silently shipped without the
      # viewer — true of every release up to and including v0.2.0.
      - name: Install viewer system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Build server binary
        if: matrix.platform != 'macos'
        run: cargo build --release --locked -p konnect

      - name: Build schematic viewer (optional)
        if: matrix.platform != 'macos'
        continue-on-error: true
        run: cargo build --release --locked --manifest-path crates/schematic-viewer/Cargo.toml

      # continue-on-error above keeps partial logs useful, but a release
      # artifact must not silently ship without the viewer — the PCM scripts
      # omit a missing viewer binary without failing.
      - name: Require viewer binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "crates/schematic-viewer/target/release/schematic-viewer.exe")) {
            Write-Error "schematic-viewer build failed - refusing to package without it"
            exit 1
          }
      - name: Require viewer binary (Linux)
        if: matrix.platform == 'linux'
        run: test -f crates/schematic-viewer/target/release/schematic-viewer

      - name: Build universal binaries (macOS)
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p konnect --target "$target"
          done
          mkdir -p dist/universal
          lipo -create -output dist/universal/konnect \
            target/aarch64-apple-darwin/release/konnect \
            target/x86_64-apple-darwin/release/konnect
          lipo -info dist/universal/konnect

      - name: Build universal schematic viewer (macOS, optional)
        if: matrix.platform == 'macos'
        continue-on-error: true
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --manifest-path crates/schematic-viewer/Cargo.toml --target "$target"
          done
          lipo -create -output dist/universal/schematic-viewer \
            crates/schematic-viewer/target/aarch64-apple-darwin/release/schematic-viewer \
            crates/schematic-viewer/target/x86_64-apple-darwin/release/schematic-viewer
          lipo -info dist/universal/schematic-viewer

      - name: Require viewer binary (macOS)
        if: matrix.platform == 'macos'
        run: test -f dist/universal/schematic-viewer

      - name: Assemble PCM package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./packaging/build-pcm.ps1 -Version $version `
            -BinaryPath target/release/konnect.exe `
            -ViewerPath crates/schematic-viewer/target/release/schematic-viewer.exe `
            -Platform windows `
            -OutDir dist

      - name: Assemble PCM package (macOS)
        if: matrix.platform == 'macos'
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./packaging/build-pcm.sh --version "$version" \
            --binary dist/universal/konnect \
            --viewer dist/universal/schematic-viewer \
            --platform macos --out dist

      - name: Assemble PCM package (Linux)
        if: matrix.platform == 'linux'
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./packaging/build-pcm.sh --version "$version" \
            --binary target/release/konnect \
            --viewer crates/schematic-viewer/target/release/schematic-viewer \
            --platform linux --out dist

      # Gate: the package must declare the platform it carries, and the bundled
      # binary must actually be that platform's executable format.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate PCM package against KiCAD schema (release gate)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install jsonschema
          version="${GITHUB_REF_NAME#v}"
          python packaging/validate-pcm.py \
            --zip "dist/konnect-pcm-v$version-${{ matrix.platform }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: konnect-pcm-${{ matrix.platform }}
          path: dist/konnect-pcm-*.zip

  release:
    name: Create Release
    needs: [build, pcm-package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
