[package]
name = "konnect-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
konnect-sexp.workspace = true
thiserror.workspace = true
tracing.workspace = true

# NNG + Protobuf for KiCAD 10 IPC API
nng.workspace = true
prost.workspace = true
prost-types.workspace = true

# The euid a discovered socket must be owned by.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"

# Builds a pipe whose security descriptor refuses this account, the condition a
# sandboxed client running as another Windows user meets.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
