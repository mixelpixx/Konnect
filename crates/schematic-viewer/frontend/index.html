<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schematic Viewer</title>
<style>
  :root {
    --bg: #1a1a2e;
    --toolbar-bg: #16213e;
    --toolbar-border: #0f3460;
    --btn-bg: #0f3460;
    --btn-border: #533483;
    --btn-hover: #533483;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #e94560;
    --overlay-h: #533483;
    --overlay-p: #666;
    --filmstrip-bg: #11182d;
    --thumb-bg: #20243a;
    --thumb-border: #39466e;
    --thumb-canvas: #282824;
  }
  body.light {
    --bg: #f5f5f5;
    --toolbar-bg: #e8e8ee;
    --toolbar-border: #c5c5d5;
    --btn-bg: #dcdce6;
    --btn-border: #9a8fc0;
    --btn-hover: #c9bfe4;
    --text: #24243a;
    --text-dim: #667;
    --accent: #c22b47;
    --overlay-h: #7a6bb0;
    --overlay-p: #999;
    --filmstrip-bg: #dddde7;
    --thumb-bg: #f4f4f7;
    --thumb-border: #aaaabd;
    --thumb-canvas: #f5f4ef;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--toolbar-border);
    z-index: 10;
    flex-shrink: 0;
  }
  .toolbar button {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  .toolbar button:hover { background: var(--btn-hover); }
  .toolbar .spacer { flex: 1; }
  .toolbar .status {
    font-size: 12px;
    color: var(--text-dim);
    max-width: 32vw;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .toolbar .zoom-display {
    font-size: 13px;
    color: var(--text-dim);
    min-width: 60px;
    text-align: center;
  }
  .toolbar .filename {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  /* SVG Container */
  #viewer {
    flex: 1;
    overflow: hidden;
    position: relative;
    cursor: grab;
  }
  #viewer.dragging { cursor: grabbing; }
  #viewer.drop-target { outline: 3px dashed var(--accent); outline-offset: -3px; }
  #viewer svg, #viewer img {
    position: absolute;
    transform-origin: 0 0;
  }
  #svg-container {
    position: absolute;
    transform-origin: 0 0;
  }

  /* Bottom page filmstrip. Every sheet stays visible as a vector thumbnail;
     the active one is a real button with keyboard focus, not a decorative
     image that only happens to respond to a mouse. */
  #filmstrip {
    height: 166px;
    flex: 0 0 166px;
    display: flex;
    align-items: stretch;
    gap: 10px;
    padding: 10px 12px;
    overflow-x: auto;
    overflow-y: hidden;
    background: var(--filmstrip-bg);
    border-top: 1px solid var(--toolbar-border);
    scroll-snap-type: x proximity;
    scrollbar-gutter: stable;
  }
  #filmstrip[hidden] { display: none; }
  .sheet-thumbnail {
    width: 190px;
    min-width: 190px;
    height: 138px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 5px;
    overflow: hidden;
    color: var(--text);
    background: var(--thumb-bg);
    border: 1px solid var(--thumb-border);
    border-radius: 6px;
    cursor: pointer;
    scroll-snap-align: center;
    transition: border-color 120ms, box-shadow 120ms, transform 120ms;
  }
  .sheet-thumbnail:hover {
    border-color: var(--btn-hover);
    transform: translateY(-1px);
  }
  .sheet-thumbnail:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .sheet-thumbnail.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent);
  }
  .thumbnail-canvas {
    min-height: 0;
    flex: 1;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--thumb-canvas);
    border-radius: 3px;
  }
  .thumbnail-canvas svg {
    position: static;
    width: 100%;
    height: 100%;
    display: block;
  }
  .thumbnail-canvas.missing::after {
    content: "Preview unavailable";
    color: var(--text-dim);
    font-size: 11px;
  }
  .thumbnail-label {
    overflow: hidden;
    color: var(--text);
    font-size: 11px;
    line-height: 18px;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  @media (max-height: 650px) {
    #filmstrip { height: 132px; flex-basis: 132px; padding-block: 7px; }
    .sheet-thumbnail { width: 158px; min-width: 158px; height: 112px; }
  }

  /* Loading / empty state */
  .overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 5;
  }
  .overlay h2 { color: var(--overlay-h); margin-bottom: 8px; }
  .overlay p { color: var(--overlay-p); font-size: 14px; }
  .overlay .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid var(--btn-border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Update / error flash: centered just below the toolbar, big enough to
     catch the eye (top-right small text went unnoticed in real testing).
     pointer-events: none is load-bearing, not cosmetic — opacity: 0 still
     hit-tests, and this element previously sat invisible over the toolbar's
     right-side buttons, silently swallowing their clicks. */
  .flash {
    position: fixed;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--btn-bg);
    color: var(--accent);
    padding: 10px 22px;
    border: 1px solid var(--accent);
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 30;
    max-width: 80vw;
    pointer-events: none;
  }
  .flash.visible { opacity: 1; }
  .flash.error { background: #5c1a2a; color: #ffb3c0; border-color: #ffb3c0; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="filename" id="filename">No file loaded</span>
  <!-- Status sits on the left of the flexible spacer: its text changes
       constantly (Live / Rendering / errors), and when it lived at the far
       right it kept shifting the buttons sideways under the cursor. -->
  <span class="status" id="status">Waiting...</span>
  <div class="spacer"></div>
  <button onclick="zoomIn()" title="Zoom in (+)">Zoom +</button>
  <button onclick="zoomOut()" title="Zoom out (-)">Zoom -</button>
  <span class="zoom-display" id="zoom-display">100%</span>
  <button onclick="fitToPage()" title="Fit to window (0)">Fit</button>
  <button onclick="manualRefresh()" title="Re-render the current sheet (R)">Refresh</button>
  <button onclick="toggleTheme()" title="Toggle dark/light theme">Theme</button>
  <button onclick="openInKicad()" title="Open this project in KiCAD">Open in KiCAD</button>
</div>

<div id="viewer">
  <div id="svg-container"></div>
  <div class="overlay" id="empty-state">
    <h2>Konnect</h2>
    <p>Schematic Viewer</p>
    <p style="margin-top:12px">Drag a .kicad_sch file here or use the MCP tool to open</p>
  </div>
  <div class="overlay" id="loading-overlay" style="display:none;">
    <div class="spinner"></div>
    <h2 id="loading-text">Rendering…</h2>
  </div>
</div>

<div id="filmstrip" hidden aria-label="Schematic pages"></div>

<div class="flash" id="flash">Updated</div>

<script>
  const { invoke } = window.__TAURI__.core;
  const { listen } = window.__TAURI__.event;
  const { getCurrentWindow } = window.__TAURI__.window;

  // WebView2's native right-click menu includes its own "Reload", which
  // reloads the whole embedded page (losing track of the open file — the
  // startup-file argument is consumed on first read) rather than doing
  // anything meaningful for a single-purpose viewer like this one.
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  const MIN_SCALE = 0.05, MAX_SCALE = 40;

  let scale = 1;
  let panX = 0, panY = 0;
  let isDragging = false;
  let dragStartX, dragStartY;
  let darkTheme = true;
  let currentSvgContent = '';
  let sheets = [];
  let activeSheetFile = '';

  const darkColorCache = new Map();
  const previewSvgByFile = new Map();

  const viewer = document.getElementById('viewer');
  const container = document.getElementById('svg-container');
  const zoomDisplay = document.getElementById('zoom-display');
  const statusEl = document.getElementById('status');
  const flashEl = document.getElementById('flash');
  const emptyState = document.getElementById('empty-state');
  const filmstrip = document.getElementById('filmstrip');
  const filenameEl = document.getElementById('filename');
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingText = document.getElementById('loading-text');

  // Unmistakable, centered loading state — a small "Rendering..." label in
  // the corner reads as "the app might be hung" on a large, slow-to-render
  // hierarchical design (real-world case: ~20 sheets took long enough that
  // it looked frozen). This can't be missed the same way.
  function showLoading(text) {
    loadingText.textContent = text || 'Rendering…';
    loadingOverlay.style.display = '';
    emptyState.style.display = 'none';
  }
  function hideLoading() {
    loadingOverlay.style.display = 'none';
  }

  function clampScale(s) {
    return Math.min(MAX_SCALE, Math.max(MIN_SCALE, s));
  }

  function updateTransform() {
    container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    zoomDisplay.textContent = Math.round(scale * 100) + '%';
  }

  function toDarkSvgColor(hex) {
    const cached = darkColorCache.get(hex);
    if (cached) return cached;

    const value = parseInt(hex.slice(1), 16);
    const r = ((value >> 16) & 0xff) / 255;
    const g = ((value >> 8) & 0xff) / 255;
    const b = (value & 0xff) / 255;

    // Equivalent color matrix to the old CSS
    // `invert(0.85) hue-rotate(180deg)` palette conversion. Applying it to
    // the SVG's colors keeps the result vector-based; a CSS filter makes
    // WebKitGTK rasterize the 297 x 210 A4 viewBox before Fit enlarges it.
    const transformed = [
      0.4018 * r - 1.0010 * g - 0.1008 * b + 0.85,
      -0.2982 * r - 0.3010 * g - 0.1008 * b + 0.85,
      -0.2982 * r - 1.0010 * g + 0.5992 * b + 0.85,
    ];
    const dark = '#' + transformed.map(channel =>
      Math.round(Math.min(1, Math.max(0, channel)) * 255)
        .toString(16)
        .padStart(2, '0')
    ).join('');
    darkColorCache.set(hex, dark);
    return dark;
  }

  function themeSvgContent(svgContent) {
    if (!darkTheme) return svgContent;
    return svgContent.replace(/#[0-9a-f]{6}\b/gi, color =>
      toDarkSvgColor(color.toLowerCase())
    );
  }

  function applySvgTheme() {
    if (!currentSvgContent) return;
    container.innerHTML = themeSvgContent(currentSvgContent);

    const svgEl = container.querySelector('svg');
    if (!svgEl) return;
    svgEl.style.background = 'transparent';

    // Ensure a viewBox so fitToPage can compute dimensions.
    if (!svgEl.getAttribute('viewBox') && svgEl.getAttribute('width')) {
      const w = parseFloat(svgEl.getAttribute('width'));
      const h = parseFloat(svgEl.getAttribute('height'));
      if (w && h) svgEl.setAttribute('viewBox', `0 0 ${w} ${h}`);
    }

    // kicad-cli's width/height carry real-world units (e.g. "419.9890mm"
    // for an A3 sheet). Force them to the viewBox's numeric units so Fit's
    // scale math and the browser's on-screen dimensions use the same basis.
    const vb = svgEl.getAttribute('viewBox');
    if (vb) {
      const parts = vb.split(/\s+/).map(Number);
      if (parts.length === 4 && parts[2] && parts[3]) {
        svgEl.setAttribute('width', String(parts[2]));
        svgEl.setAttribute('height', String(parts[3]));
      }
    }
    renderFilmstrip();
  }

  function setSvg(svgContent) {
    currentSvgContent = svgContent;
    emptyState.style.display = 'none';
    hideLoading();
    applySvgTheme();
  }

  // `sticky` keeps the message up until the next flash replaces it — for
  // in-progress states (re-rendering) rather than one-shot notifications.
  // The single shared timer matters: without it, an earlier flash's
  // hide-timeout fires late and wipes whatever message replaced it.
  let flashTimer = null;
  function flash(msg, isError, sticky) {
    flashEl.textContent = msg || 'Updated';
    flashEl.classList.toggle('error', !!isError);
    flashEl.classList.add('visible');
    if (flashTimer) {
      clearTimeout(flashTimer);
      flashTimer = null;
    }
    if (!sticky) {
      flashTimer = setTimeout(() => flashEl.classList.remove('visible'), isError ? 4000 : 2000);
    }
  }

  function fitToPage() {
    const svgEl = container.querySelector('svg');
    if (!svgEl) return;
    const vb = svgEl.getAttribute('viewBox');
    if (!vb) return;
    const [, , svgW, svgH] = vb.split(/\s+/).map(Number);
    const viewW = viewer.clientWidth;
    const viewH = viewer.clientHeight;
    scale = clampScale(Math.min(viewW / svgW, viewH / svgH) * 0.95);
    panX = (viewW - svgW * scale) / 2;
    panY = (viewH - svgH * scale) / 2;
    updateTransform();
  }

  function zoomIn() { scale = clampScale(scale * 1.25); updateTransform(); }
  function zoomOut() { scale = clampScale(scale * 0.8); updateTransform(); }

  function toggleTheme() {
    darkTheme = !darkTheme;
    document.body.classList.toggle('light', !darkTheme);
    applySvgTheme();
  }

  async function openInKicad() {
    try {
      await invoke('open_in_kicad');
      statusEl.textContent = 'Opened in KiCAD';
    } catch (e) {
      statusEl.textContent = 'Error: ' + e;
      flash(String(e), true);
    }
  }

  // Mouse wheel zoom (centered on cursor)
  viewer.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = viewer.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
    const newScale = clampScale(scale * zoomFactor);
    if (newScale === scale) return;

    // Adjust pan to zoom toward cursor
    panX = mouseX - (mouseX - panX) * (newScale / scale);
    panY = mouseY - (mouseY - panY) * (newScale / scale);
    scale = newScale;

    updateTransform();
  }, { passive: false });

  // Mouse drag pan
  viewer.addEventListener('mousedown', (e) => {
    isDragging = true;
    dragStartX = e.clientX - panX;
    dragStartY = e.clientY - panY;
    viewer.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    panX = e.clientX - dragStartX;
    panY = e.clientY - dragStartY;
    updateTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    viewer.classList.remove('dragging');
  });

  // Keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.key === '+' || e.key === '=') zoomIn();
    else if (e.key === '-') zoomOut();
    else if (e.key === '0') fitToPage();
    else if (e.key === 'r' || e.key === 'R') manualRefresh();
    else if (e.key === 'ArrowLeft') { e.preventDefault(); navigateSheet(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); navigateSheet(1); }
  });

  async function manualRefresh() {
    try {
      statusEl.textContent = 'Refreshing...';
      showLoading('Refreshing...');
      const preview = await invoke('refresh');
      previewSvgByFile.set(preview.file, preview.svg);
      setSvg(preview.svg);
      flash('Refreshed');
      statusEl.textContent = 'Live';
    } catch (e) {
      hideLoading();
      statusEl.textContent = 'Error: ' + e;
      flash(String(e), true);
    }
  }

  // ─── Live page filmstrip ───────────────────────────────────────────────

  function fileName(path) {
    return path.split(/[\\/]/).pop() || path;
  }

  function renderFilmstrip(scrollActive = false) {
    filmstrip.replaceChildren();
    filmstrip.hidden = sheets.length === 0;
    if (!sheets.length) return;

    const fragment = document.createDocumentFragment();
    let activeButton = null;
    sheets.forEach((sheet, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'sheet-thumbnail';
      button.classList.toggle('active', sheet.file === activeSheetFile);
      button.setAttribute('aria-pressed', String(sheet.file === activeSheetFile));
      button.title = `Open ${sheet.name}`;

      const canvas = document.createElement('span');
      canvas.className = 'thumbnail-canvas';
      const svg = previewSvgByFile.get(sheet.file);
      if (svg) {
        canvas.innerHTML = themeSvgContent(svg);
      } else {
        canvas.classList.add('missing');
      }

      const label = document.createElement('span');
      label.className = 'thumbnail-label';
      const hierarchy = sheet.depth > 0 ? `${'› '.repeat(sheet.depth)}` : '';
      label.textContent = `${index + 1}. ${hierarchy}${sheet.name}`;

      button.append(canvas, label);
      button.addEventListener('click', () => selectSheet(sheet.file));
      fragment.appendChild(button);
      if (sheet.file === activeSheetFile) activeButton = button;
    });
    filmstrip.appendChild(fragment);

    if (scrollActive && activeButton) {
      requestAnimationFrame(() => activeButton.scrollIntoView({
        behavior: 'smooth',
        block: 'nearest',
        inline: 'center',
      }));
    }
  }

  function updateSheetState(nextSheets, updatedPreviews, activeFile, replacePreviews = false) {
    if (replacePreviews) previewSvgByFile.clear();
    for (const preview of updatedPreviews || []) {
      previewSvgByFile.set(preview.file, preview.svg);
    }

    sheets = nextSheets || [];
    const knownFiles = new Set(sheets.map(sheet => sheet.file));
    for (const file of previewSvgByFile.keys()) {
      if (!knownFiles.has(file)) previewSvgByFile.delete(file);
    }

    activeSheetFile = activeFile || sheets[0]?.file || '';
    if (activeSheetFile) filenameEl.textContent = fileName(activeSheetFile);
    renderFilmstrip();
  }

  async function selectSheet(file) {
    if (!file || file === activeSheetFile) return;
    try {
      statusEl.textContent = 'Loading sheet...';
      showLoading('Loading sheet...');
      const svg = await invoke('select_sheet', { file });
      activeSheetFile = file;
      filenameEl.textContent = fileName(file);
      setSvg(svg);
      fitToPage();
      renderFilmstrip(true);
      statusEl.textContent = 'Live';
    } catch (e) {
      hideLoading();
      statusEl.textContent = 'Error: ' + e;
      flash(String(e), true);
    }
  }

  function navigateSheet(delta) {
    if (!sheets.length) return;
    const current = Math.max(0, sheets.findIndex(sheet => sheet.file === activeSheetFile));
    const next = Math.min(sheets.length - 1, Math.max(0, current + delta));
    if (next !== current) selectSheet(sheets[next].file);
  }

  filmstrip.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
    e.preventDefault();
    filmstrip.scrollLeft += e.deltaY;
  }, { passive: false });

  // Live updates and errors from the Rust backend.
  //
  // listen() returns a promise that REJECTS if the event API isn't permitted
  // by the app's Tauri capability file — and a top-level unhandled rejection
  // is completely silent. That exact failure shipped once: with no
  // capabilities/ dir, every listener below was dead, the backend emitted
  // into a void, and live updates simply "didn't work" with nothing in any
  // log. Surface it unmissably instead.
  function listenOrWarn(name, handler) {
    listen(name, handler).catch((e) => {
      statusEl.textContent = 'Event wiring failed';
      flash('Event wiring failed for "' + name + '": ' + e, true);
    });
  }

  listenOrWarn('schematic-updated', (event) => {
    setSvg(event.payload);
    flash('File changed — updated');
    statusEl.textContent = 'Live';
  });

  // Fired whenever the watcher completes a render cycle. Sheet metadata keeps
  // the filmstrip ordered and removes deleted pages; updated_previews carries
  // only SVGs rendered in this cycle, avoiding a full hierarchy transfer for
  // every one-sheet edit. `active_file` reflects a backend fallback-to-root
  // when the selected sheet was deleted.
  // Emitted at the end of every render cycle (whether or not the active
  // sheet changed) — so it also retires the sticky "re-rendering" flash.
  // The retirement is deferred a beat: when the active sheet WAS
  // re-rendered, schematic-updated lands right behind this event and takes
  // over the flash — showing "Re-render complete" for a split second first
  // just reads as flicker. It only appears when it's genuinely the final
  // word (the edit touched sheets other than the one on screen).
  listenOrWarn('sheets-updated', (event) => {
    updateSheetState(
      event.payload.sheets,
      event.payload.updated_previews,
      event.payload.active_file
    );
    statusEl.textContent = 'Live';
    setTimeout(() => {
      if (flashEl.classList.contains('visible') && flashEl.textContent === RENDERING_MSG) {
        flash('Re-render complete');
      }
    }, 150);
  });

  // Fired the instant the backend's watcher notices a relevant file change,
  // before any rendering starts (which can take a while on a big design) -
  // makes "watcher never fired" visibly different from "render failed".
  const RENDERING_MSG = 'Change detected - re-rendering...';
  listenOrWarn('change-detected', () => {
    statusEl.textContent = RENDERING_MSG;
    // Sticky: stays up for the whole render (can be several seconds on a
    // big design) so the user watches a state, not a vanishing blip. The
    // sheets-updated handler below retires it when the cycle finishes.
    flash(RENDERING_MSG, false, true);
  });

  listenOrWarn('viewer-error', (event) => {
    statusEl.textContent = 'Error';
    flash(String(event.payload), true);
  });

  // Drag & drop a .kicad_sch onto the window
  getCurrentWindow().onDragDropEvent((event) => {
    const t = event.payload.type;
    if (t === 'enter' || t === 'over') {
      viewer.classList.add('drop-target');
    } else if (t === 'leave') {
      viewer.classList.remove('drop-target');
    } else if (t === 'drop') {
      viewer.classList.remove('drop-target');
      const path = (event.payload.paths || []).find(p => p.toLowerCase().endsWith('.kicad_sch'));
      if (path) {
        window.loadSchematic(path);
      } else {
        flash('Not a .kicad_sch file', true);
      }
    }
  });

  // Called on startup (with the CLI-arg file, if any) and on drag-drop.
  // Opens the ROOT of a design — the backend walks the full sheet tree from
  // there and eagerly renders every sheet it finds.
  window.loadSchematic = async function(path) {
    try {
      filenameEl.textContent = path.split(/[\\/]/).pop();
      statusEl.textContent = 'Rendering...';
      showLoading('Rendering... (a large hierarchical design can take a while — every sheet is rendered up front)');
      const result = await invoke('open_schematic', { path });
      updateSheetState(result.sheets, result.previews, result.active_file, true);
      setSvg(result.svg);
      fitToPage();
      if (result.render_errors && result.render_errors.length) {
        flash(`${result.render_errors.length} sheet(s) failed to render`, true);
      }
      statusEl.textContent = 'Live — watching for changes';
    } catch (e) {
      hideLoading();
      statusEl.textContent = 'Error: ' + e;
      flash(String(e), true);
      console.error(e);
    }
  };

  // Startup: ask the backend for the CLI-arg file. This replaces the old
  // sleep-and-eval handoff — the frontend pulls when it's ready.
  (async function init() {
    try {
      const startupFile = await invoke('get_startup_file');
      if (startupFile) {
        await window.loadSchematic(startupFile);
      } else {
        statusEl.textContent = 'Ready — drop a file or use the open_schematic_viewer MCP tool';
      }
    } catch (e) {
      console.error(e);
    }
  })();
</script>
</body>
</html>
